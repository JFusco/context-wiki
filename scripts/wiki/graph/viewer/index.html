<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Repository wiki graph</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header><h1>Repository wiki graph</h1><p>Only pages under <code>wiki/</code> are indexed.</p></header>
  <aside>
    <label>Search <input id="search" type="search" placeholder="Page or path"></label>
    <fieldset><legend>Types</legend>
      <label><input type="checkbox" name="type" value="index" checked> Index</label>
      <label><input type="checkbox" name="type" value="topic" checked> Topic</label>
      <label><input type="checkbox" name="type" value="journal" checked> Journal</label>
      <label><input type="checkbox" name="type" value="plan" checked> Plan</label>
    </fieldset>
    <div id="details">Select a node.</div>
  </aside>
  <main id="graph" aria-label="Interactive wiki relationship graph"></main>
  <script src="vendor/graphology.umd.min.js"></script>
  <script src="vendor/graphology-library.min.js"></script>
  <script src="vendor/sigma.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
